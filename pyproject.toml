[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pai_core"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "mujoco>=3.2", "gymnasium>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]. Puis pip install -e .